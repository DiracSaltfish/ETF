data_root: /Volumes/Stocksdata
output_dir: outputs
benchmark_data_dir: data/total_return_indices

# 回测只使用现有指数库与主连期货库同时覆盖的日期。
end_date: "2025-12-31"
annual_trading_days: 252
notional_exposure: 1.0

# 基准情景：不把尚未核实的保证金利息计入收益。
cash_yield_annual: 0.0
margin_rate: 0.12

# 中金所股指期货非平今交易手续费：成交金额的万分之零点二三。
exchange_fee_rate: 0.000023
broker_fee_multiplier: 1.0

# 每边 0.2 指数点（1 个最小变动价位）的执行滑点假设。
slippage_points_per_side: 0.2

